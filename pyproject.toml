[project]
name = "gahaku"
version = "0.1.0"
description = "OpenAI の画像 API で、ブログのアイキャッチやサイトの画像素材を作る CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pillow>=10"]

[project.scripts]
gahaku = "gahaku.cli:main"

[project.urls]
Repository = "https://github.com/hdmt/gahaku"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gahaku"]
